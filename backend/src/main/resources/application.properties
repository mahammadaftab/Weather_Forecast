# Server configuration
server.port=8080

# MongoDB configuration
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=weather_forecast

# JWT configuration
app.jwtSecret=weatherForecastSecretKey
app.jwtExpirationInMs=86400000

# Logging configuration
logging.level.com.weatherforecast=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# Allow bean definition overriding
spring.main.allow-bean-definition-overriding=true

# Allow circular references
spring.main.allow-circular-references=true

# Cache configuration
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=30m

# OpenWeatherMap API
openweathermap.api.key=8d05b1127c32ece687c6a32484dcdc5c

# IP Geolocation API
ipapi.api.key=8468823a569ffced3af05f35040b55b0